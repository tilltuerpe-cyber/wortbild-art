<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tipp ein Wort und es malt sein eigenes, einmaliges Bild.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Wortbild</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a gallery wall. One 4:5 poster on the left, a narrow museum label on the right.
   The whole page takes its colors from the picture, so every word repaints the room.
   Single committed look: the tokens below are the starting room, the script swaps them per word. */
:root {
  color-scheme: dark;
  --wall: #0d1117;
  --ink: #e6e2d8;
  --dim: #8d93a0;
  --hi: #ff8a5c;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--wall); color: var(--ink);
  font-family: var(--mono); font-size: 14px; line-height: 1.6;
  transition: background-color 0.6s, color 0.6s;
}
.wrap {
  max-width: 1120px; margin-inline: auto; padding-block: 22px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
p, h1, h2, figure { margin: 0; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 20px; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 30px; line-height: 1; font-weight: 400; }
.brand i { color: var(--hi); transition: color 0.6s; }
.top p { color: var(--dim); }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; color: var(--dim); }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 3px; }

.room { display: grid; grid-template-columns: minmax(0, 620px) minmax(240px, 1fr); gap: 28px 44px; align-items: start; }
@media (max-width: 820px) { .room { grid-template-columns: minmax(0, 1fr); } }

.poster {
  position: relative; container-type: inline-size; aspect-ratio: 4 / 5; max-width: 100%;
  border: 1px solid var(--ink); padding: 10px; transition: border-color 0.6s;
}
.poster canvas { display: block; width: 100%; height: 100%; }
.poster .word {
  position: absolute; left: 6cqw; right: 6cqw; bottom: 5cqw;
  font-family: var(--serif); font-style: italic; line-height: 0.95; white-space: nowrap; overflow: hidden;
  color: var(--ink); text-shadow: 0 0 0.25em var(--wall), 0 0 0.6em var(--wall);
  pointer-events: none; transition: color 0.6s;
}
.poster .nr { position: absolute; top: 5cqw; right: 6cqw; color: var(--ink); text-shadow: 0 0 6px var(--wall); font-size: max(10px, 2.2cqw); letter-spacing: 0.12em; }

.side { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field input {
  width: 100%; min-width: 0; background: transparent; color: var(--ink);
  border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; padding: 4px 0 6px;
  font-family: var(--serif); font-style: italic; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1;
}
.field input::placeholder { color: var(--dim); }
.field input:focus { outline: none; border-bottom-color: var(--hi); }
.tries { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--dim); border-radius: 99px; padding: 5px 13px;
}
button:hover { border-color: var(--ink); }
button.go { background: var(--ink); color: var(--wall); border-color: var(--ink); font-weight: 700; }

.label { border-top: 1px solid var(--dim); padding-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.label h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
.label dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; }
.label dt { color: var(--dim); }
.label dd { margin: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { display: flex; align-items: center; gap: 8px; padding: 4px 11px 4px 5px; font-size: 12px; }
.sw span { width: 20px; height: 20px; border-radius: 50%; flex: none; border: 1px solid var(--dim); }
.fine { color: var(--dim); max-width: 34em; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Wort<i>bild</i></h1>
    <p>Jedes Wort malt sein eigenes Bild.</p>
  </header>

  <div class="room">
    <figure class="poster">
      <canvas id="cv" width="1000" height="1250" aria-label="Aus dem Wort erzeugtes Bild"></canvas>
      <div class="nr" id="nr"></div>
      <div class="word" id="word"></div>
    </figure>

    <div class="side">
      <div class="field">
        <label class="caps" for="inp">Dein Wort</label>
        <input id="inp" maxlength="24" autocomplete="off" spellcheck="false" placeholder="tipp was">
        <div class="tries">
          <button class="go" type="button" id="rnd">Zufallswort</button>
          <button type="button" id="again">Nochmal malen</button>
          <button type="button" id="save">Bild speichern</button>
        </div>
      </div>

      <div class="label">
        <span class="caps">Werkangaben</span>
        <h2 id="title"></h2>
        <dl>
          <dt>Nummer</dt><dd id="mNr"></dd>
          <dt>Stil</dt><dd id="mStyle"></dd>
          <dt>Linien</dt><dd id="mLines"></dd>
          <dt>Grund</dt><dd id="mGround"></dd>
        </dl>
        <div>
          <span class="caps">Farben · Klick kopiert den Farbcode</span>
          <div class="swatches" id="sw" style="margin-top:8px"></div>
        </div>
      </div>

      <p class="fine">Das Bild wird aus den Buchstaben berechnet. Dasselbe Wort ergibt immer dasselbe Bild, auf jedem Gerät. Ändere einen Buchstaben und alles wird anders.</p>
    </div>
  </div>
</div>

<script>
(function () {
  var W = 1000, H = 1250, FRAMES = 300, PRE = 45;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var inp = document.getElementById("inp"), root = document.documentElement;
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var WORDS = ["Fernweh", "Gewitter", "Pixel", "Mitternacht", "Kirsche", "Nebel", "Turbo", "Ozean", "Feuerwerk", "Limo", "Komet", "Samt", "Glitzer", "Beton", "Sommerregen", "Neon"];
  var STYLES = ["Strömung", "Wirbel", "Raster", "Fasern"];
  var run = 0;

  function hash(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rng(seed) {
    var a = seed;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
    var f = function (n) { var v = l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return ("0" + Math.round(v * 255).toString(16)).slice(-2); };
    return "#" + f(0) + f(8) + f(4);
  }

  function plan(word) {
    var seed = hash(word), r = rng(seed);
    var hue = r() * 360, light = r() < 0.25, scheme = Math.floor(r() * 3);
    var offs = scheme === 0 ? [0, 28, -32, 60] : scheme === 1 ? [0, 180, 24, 204] : [0, 120, 240, 30];
    var wall = light ? hex(hue, 22 + r() * 14, 90) : hex(hue, 28 + r() * 30, 7 + r() * 5);
    var ink = light ? hex(hue, 30, 13) : hex(hue + 40, 22, 88);
    var dim = light ? hex(hue, 12, 42) : hex(hue, 12, 60);
    var cols = offs.map(function (o) { return hex(hue + o + (r() - 0.5) * 16, 62 + r() * 30, light ? 34 + r() * 16 : 56 + r() * 14); });
    var style = Math.floor(r() * STYLES.length);
    var waves = [];
    for (var i = 0; i < 3; i++) waves.push({ fx: (r() - 0.5) * 0.012, fy: (r() - 0.5) * 0.012, ph: r() * 6.28, amp: 0.5 + r() });
    var hubs = [], nh = 2 + Math.floor(r() * 3);
    for (var j = 0; j < nh; j++) hubs.push({ x: W * (0.15 + r() * 0.7), y: H * (0.12 + r() * 0.7), dir: r() < 0.5 ? 1 : -1, pull: (r() - 0.4) * 0.5 });
    return {
      word: word, seed: seed, r: r, light: light, wall: wall, ink: ink, dim: dim, cols: cols, style: style,
      waves: waves, hubs: hubs, snap: Math.PI / (2 + Math.floor(r() * 3)),
      count: 600 + Math.floor(r() * 700), step: 2.2 + r() * 2.2, thick: 0.7 + r() * 1.6, alpha: light ? 0.6 : 0.5
    };
  }

  function angle(p, x, y) {
    var a = 0, i;
    if (p.style === 1) {
      var vx = 0, vy = 0;
      for (i = 0; i < p.hubs.length; i++) {
        var hb = p.hubs[i], dx = x - hb.x, dy = y - hb.y, d = Math.sqrt(dx * dx + dy * dy) + 40;
        var t = Math.atan2(dy, dx) + hb.dir * (Math.PI / 2 + hb.pull);
        vx += Math.cos(t) / d; vy += Math.sin(t) / d;
      }
      return Math.atan2(vy, vx);
    }
    for (i = 0; i < 3; i++) { var w = p.waves[i]; a += Math.sin(x * w.fx + y * w.fy + w.ph) * w.amp; }
    a *= Math.PI;
    if (p.style === 2) a = Math.round(a / p.snap) * p.snap;
    if (p.style === 3) a = a * 0.25 + p.waves[0].ph;
    return a;
  }

  function paint(word) {
    var p = plan(word), r = p.r, my = ++run, parts = [], frame = 0;
    root.style.setProperty("--wall", p.wall); root.style.setProperty("--ink", p.ink);
    root.style.setProperty("--dim", p.dim); root.style.setProperty("--hi", p.cols[0]);
    root.style.colorScheme = p.light ? "light" : "dark";
    describe(p);

    ctx.globalAlpha = 1; ctx.fillStyle = p.wall; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";
    function born(q) {
      q.x = r() * W; q.y = r() * H; q.life = 30 + r() * 170;
      q.c = p.cols[r() < 0.5 ? 0 : 1 + Math.floor(r() * 3)];
      q.w = p.thick * (0.5 + r() * 1.4);
      return q;
    }
    for (var i = 0; i < p.count; i++) parts.push(born({}));
    function tick() {
      ctx.globalAlpha = p.alpha;
      for (var i = 0; i < parts.length; i++) {
        var q = parts[i], a = angle(p, q.x, q.y);
        var nx = q.x + Math.cos(a) * p.step, ny = q.y + Math.sin(a) * p.step;
        ctx.strokeStyle = q.c; ctx.lineWidth = q.w;
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(nx, ny); ctx.stroke();
        q.x = nx; q.y = ny; q.life--;
        if (q.life <= 0 || nx < -20 || nx > W + 20 || ny < -20 || ny > H + 20) born(q);
      }
      frame++;
    }
    var first = calm ? FRAMES : PRE;
    while (frame < first) tick();
    function loop() {
      if (my !== run || frame >= FRAMES) return;
      tick(); tick();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  function describe(p) {
    var nr = ("00000" + (p.seed % 1048576).toString(16).toUpperCase()).slice(-5);
    var shown = p.word;
    var wEl = document.getElementById("word");
    wEl.textContent = shown;
    wEl.style.fontSize = "min(24cqw, " + (185 / Math.max(shown.length, 1)).toFixed(1) + "cqw)";
    document.getElementById("nr").textContent = "NR. " + nr;
    document.getElementById("title").textContent = "„" + shown + "“";
    document.getElementById("mNr").textContent = nr;
    document.getElementById("mStyle").textContent = STYLES[p.style];
    document.getElementById("mLines").textContent = p.count.toLocaleString("de-DE");
    document.getElementById("mGround").textContent = (p.light ? "hell " : "dunkel ") + p.wall.toUpperCase();
    var sw = document.getElementById("sw");
    sw.textContent = "";
    p.cols.forEach(function (c, i) {
      var b = document.createElement("button"), dot = document.createElement("span"), t = document.createElement("b");
      b.type = "button"; b.className = "sw"; b.id = "sw-" + i;
      dot.style.background = c; t.textContent = c.toUpperCase(); t.style.fontWeight = "400";
      b.appendChild(dot); b.appendChild(t);
      b.addEventListener("click", function () {
        var done = function () { t.textContent = "kopiert"; setTimeout(function () { t.textContent = c.toUpperCase(); }, 1100); };
        try { navigator.clipboard.writeText(c.toUpperCase()).then(done, function () {}); } catch (e) {}
      });
      sw.appendChild(b);
    });
  }

  var current = "";
  function show(raw, fromInput) {
    var word = String(raw).trim().toLowerCase().slice(0, 24);
    if (!word || word === current) return;
    current = word;
    if (!fromInput) inp.value = word;
    paint(word);
    try {
      if (/^[a-z0-9-]+$/.test(word)) history.replaceState(null, "", "#w-" + word);
    } catch (e) {}
  }

  var timer = 0;
  inp.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { show(inp.value, true); }, 350);
  });
  document.getElementById("rnd").addEventListener("click", function () {
    var w;
    do { w = WORDS[Math.floor(Math.random() * WORDS.length)]; } while (w.toLowerCase() === current);
    show(w);
  });
  document.getElementById("again").addEventListener("click", function () { if (current) paint(current); });
  document.getElementById("save").addEventListener("click", function () {
    if (!current) return;
    var a = document.createElement("a");
    a.download = "wortbild-" + current.replace(/[^a-z0-9äöüß-]/gi, "_") + ".png";
    a.href = cv.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  });
  function fromHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (/^w-[a-z0-9-]+$/i.test(h)) { show(h.slice(2)); return true; }
    return false;
  }
  window.addEventListener("hashchange", fromHash);
  if (!fromHash()) show("hallo");
})();
</script>
</body>
</html>
